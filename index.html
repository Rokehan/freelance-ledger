<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Freelance Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="app.css?v=1.8.1">
</head>
<body>
<div id="app"><p style="padding:2rem;font-family:system-ui;color:#2fd6ff">Loading…</p></div>
<noscript>This app needs JavaScript.</noscript>
<script>
// Safety net: if the app hasn't started after 10s (e.g. half-updated files), offer a clean reload.
// Only clears the cached app files. Your invoices and settings are kept.
(function () {
  var err = '';
  window.addEventListener('error', function (e) { err = (e && e.message) || err; });
  function rescue() {
    var app = document.getElementById('app');
    if (!app || !/Loading…/.test(app.textContent) || app.dataset.started) return;
    app.innerHTML = '<div style="max-width:420px;margin:15vh auto;padding:1.5rem;font-family:system-ui;color:#eaf2ff;text-align:center">'
      + '<p style="font-size:1.1rem"><b>The app didn\'t start.</b></p>'
      + '<p style="color:#8494c4;font-size:.9rem">Usually this is a half-finished update. A clean reload fixes it. Your data is kept.</p>'
      + '<button id="fl-fix" style="margin-top:1rem;padding:.8rem 1.2rem;border:0;border-radius:12px;background:#2fd6ff;color:#050816;font-weight:700;font-size:1rem">Reload fresh</button>'
      + (err ? '<p style="color:#56648f;font-size:.75rem;margin-top:1rem">' + String(err).replace(/</g, '&lt;') + '</p>' : '') + '</div>';
    document.getElementById('fl-fix').onclick = function () {
      var done = function () { location.replace(location.pathname + '?fresh=' + Date.now()); };
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).then(done, done);
    };
  }
  setTimeout(rescue, 10000);
})();
</script>
<script type="module" src="app.js?v=1.8.1"></script>
</body>
</html>
